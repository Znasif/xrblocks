<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scene Graph | XR Blocks</title>
    <link rel="stylesheet" href="../demo.css" />
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
        font-family: system-ui, sans-serif;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        max-width: 420px;
        max-height: calc(100vh - 24px);
        overflow: auto;
        padding: 12px 14px;
        border-radius: 12px;
        background: rgba(8, 12, 20, 0.78);
        color: #e8eef7;
        font-size: 13px;
        line-height: 1.4;
        z-index: 20;
        pointer-events: auto;
      }
      #hud h1 {
        margin: 0 0 6px;
        font-size: 15px;
        font-weight: 600;
      }
      #status {
        color: #9fd1ff;
        min-height: 1.2em;
      }
      #metrics {
        margin: 8px 0;
        display: grid;
        grid-template-columns: auto auto;
        gap: 2px 12px;
        font-variant-numeric: tabular-nums;
      }
      #metrics span:nth-child(odd) {
        color: #8ea0b8;
      }
      #graph {
        margin: 6px 0 0;
        padding: 0;
        list-style: none;
      }
      #graph li {
        padding: 2px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
      }
      #graph .spatial {
        color: #7fbfff;
      }
      #graph .semantic {
        color: #ffc46b;
      }
      #graph .score {
        color: #8ea0b8;
        float: right;
      }
      #controls {
        display: flex;
        gap: 8px;
        margin: 8px 0;
      }
      #controls button {
        flex: 1;
        padding: 6px 10px;
        border: 0;
        border-radius: 8px;
        background: #263a50;
        color: #f4f8fc;
        cursor: pointer;
      }
      #controls button.active {
        background: #3a78c2;
      }
      #ask {
        margin: 8px 0;
        padding: 8px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      }
      #ask form {
        display: flex;
        gap: 8px;
      }
      #talk {
        flex: 0 0 auto;
        padding: 6px 12px;
        border: 0;
        border-radius: 8px;
        background: #6b2a5c;
        color: #fff;
        cursor: pointer;
        touch-action: none;
        user-select: none;
      }
      #talk.active {
        background: #ff4fd1;
        color: #1a0716;
      }
      #talk[disabled] {
        opacity: 0.4;
      }
      #askText {
        flex: 1;
        min-width: 0;
        padding: 6px 8px;
        border: 1px solid #33465c;
        border-radius: 8px;
        background: #0e1724;
        color: #e8eef7;
      }
      #answer {
        margin-top: 6px;
        min-height: 1.2em;
        color: #c8d3e3;
      }
      #answer .query,
      #answer .alts {
        color: #8ea0b8;
        font-size: 12px;
      }
      #answer .hit {
        color: #ff8fe3;
        font-weight: 600;
      }
      #graph li.hit {
        background: rgba(255, 79, 209, 0.14);
      }
      #preview {
        position: fixed;
        right: 12px;
        bottom: 12px;
        width: 336px;
        border-radius: 10px;
        background: #000;
        z-index: 20;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
          "three/": "https://cdn.jsdelivr.net/npm/three@0.186.0/",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/",
          "lit": "https://esm.sh/lit@3.3.1",
          "lit/": "https://esm.sh/lit@3.3.1/",
          "@pmndrs/uikit": "https://cdn.jsdelivr.net/npm/@pmndrs/uikit@1.0.64/dist/index.min.js",
          "@pmndrs/uikit-pub-sub": "https://cdn.jsdelivr.net/npm/@pmndrs/uikit-pub-sub@1.0.64/dist/index.min.js",
          "@pmndrs/msdfonts": "https://cdn.jsdelivr.net/npm/@pmndrs/msdfonts@1.0.64/dist/index.min.js",
          "@preact/signals-core": "https://cdn.jsdelivr.net/npm/@preact/signals-core@1.14.0/dist/signals-core.mjs",
          "yoga-layout/load": "https://cdn.jsdelivr.net/npm/yoga-layout@3.2.1/dist/src/load.js",
          "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.34/vision_bundle.mjs",
          "onnxruntime-web": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/ort.webgpu.min.mjs",
          "@huggingface/transformers": "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.1/dist/transformers.min.js",
          "xrblocks": "../../build/xrblocks.js",
          "xrblocks/addons/": "../../build/addons/"
        }
      }
    </script>
  </head>
  <body>
    <div id="hud">
      <h1>Scene graph: detections + relations, on device</h1>
      <div id="status">starting…</div>
      <div id="controls">
        <button id="scan">scan</button>
        <button id="auto" class="active">auto</button>
      </div>
      <div id="ask">
        <form id="askForm">
          <button id="talk" type="button">hold to ask</button>
          <input id="askText" placeholder="or type: where is the cup?" />
        </form>
        <div id="answer">voice search loads after the relation model</div>
      </div>
      <div id="metrics"></div>
      <ul id="graph"></ul>
    </div>
    <canvas id="preview" width="336" height="189"></canvas>
    <script type="module" src="main.js"></script>
  </body>
</html>
